# Сборка Russificator.exe на серверах GitHub.
# Тег вида v2.1.0 -> тесты, сборка, самопроверка exe и релиз с архивом Russificator-win64.zip.
# Запуск вручную (Actions -> build -> Run workflow) — то же самое, архив остаётся в артефактах.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Тесты
        run: python -m pytest -q

      # Живой перевод вживую: распознавание текста Windows (оба способа) и окна оверлея.
      # Только диагностика в журнале — сборку не останавливает.
      - name: Живой перевод на Windows (диагностика)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/ci_overlay_check.py

      - name: Сборка установщика (Установить.exe для архивов «для друзей»)
        shell: pwsh
        run: |
          pyinstaller installer.spec --noconfirm
          $p = Start-Process -FilePath dist\RussificatorSetup.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\RussificatorSetup\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "installer selftest failed: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force russificator\resources\installer | Out-Null
          Copy-Item dist\RussificatorSetup.exe russificator\resources\installer\RussificatorSetup.exe

      - name: Сборка exe
        run: pyinstaller russificator.spec --noconfirm

      # Как у пользователя: браузер помечает скачанный архив «из интернета», Проводник переносит пометку на
      # каждый распакованный файл — а .NET помеченные сборки не загружает. Программа должна справиться сама.
      - name: Самопроверка exe (файлы помечены «из интернета», как после скачивания браузером)
        shell: pwsh
        run: |
          Get-ChildItem dist\Russificator -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $p = Start-Process -FilePath dist\Russificator\Russificator.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\Russificator\RussificatorData\logs\selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          Remove-Item -Recurse -Force dist\Russificator\RussificatorData

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path dist\Russificator -DestinationPath Russificator-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Russificator-win64
          path: Russificator-win64.zip

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Russificator-win64.zip
          generate_release_notes: true

  # Русификация Ren'Py настоящим движком (8.3 и 7.4): демо-игра из SDK русифицируется,
  # ставится архивом «для друзей» и запускается под виртуальным экраном. Отдельное
  # задание — релиз его не ждёт.
  renpy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libgl1-mesa-dri libegl1 libglu1-mesa
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ren'Py 8 и 7
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/ci_renpy_check.py 8.3.7 7.4.11
