# Проверка русификации настоящими движками (сейчас — Ren'Py 8 и 7): демо-игра из SDK
# русифицируется, ставится архивом «для друзей» и запускается под виртуальным экраном.
# Отдельно от сборки: релиз не ждёт этой проверки.
name: engines

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  renpy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libgl1-mesa-dri libegl1 libglu1-mesa
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ren'Py 8 и 7
        run: python tools/ci_renpy_check.py 8.3.7 7.4.11
